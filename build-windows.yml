name: Build Windows app

# Builds "Goyim Screener.exe" on GitHub's Windows machines.
# Runs whenever you push a change to the app, or when you click "Run workflow".
# Download it from: Actions tab → latest "Build Windows app" run → Artifacts → Windows-app
# Push a tag like v1.0.1 to also publish it as a Release (permanent download link).

on:
  push:
    branches: [main]
    paths: ["app/**", "build/**", "requirements.txt", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Goyim Screener.exe
        run: pyinstaller build/ema_zone.spec --noconfirm --clean

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/*" -DestinationPath "Windows-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-app
          path: Windows-app.zip
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Windows-app.zip
