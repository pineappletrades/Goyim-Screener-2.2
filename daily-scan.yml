name: Daily backup scan

# Sends the Telegram alert even when your computer is off.
# Uses the strategy files in app/defaults (edit those to change the backup's rules).
# The Investing strategy scans every US stock over $5B (~1,000+ names), so a run takes 10–20 minutes.
on:
  schedule:
    # 21:20 UTC Mon–Fri = 2:20 PM PDT / 1:20 PM PST, after the close
    - cron: "20 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-headless.txt
      - run: python app/headless.py
        env:
          PUBLIC_API_SECRET_KEY: ${{ secrets.PUBLIC_API_SECRET_KEY }}
          PUBLIC_ACCOUNT_NUMBER: ${{ secrets.PUBLIC_ACCOUNT_NUMBER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
