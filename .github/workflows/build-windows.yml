name: Build Windows app

# Builds "Goyim Screener.exe" on GitHub's Windows machines.
# Works with the flat upload (all files in the repo root): it first sorts them into the
# app/, build/ folders the PyInstaller recipe expects, then builds and self-tests.
# Download: Actions tab -> latest "Build Windows app" run -> Artifacts -> Windows-app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into the expected layout
        shell: bash
        run: |
          set -e
          if [ -d app/engine ]; then echo "Already structured"; exit 0; fi
          mkdir -p app/engine app/defaults/providers app/defaults/rules app/defaults/data app/ui build
          mv desktop.py headless.py app/
          mv __init__.py alerts.py backtest.py backup.py ema_finder.py gamma.py notify.py paths.py \
             plugin_api.py registry.py rotation.py scanner.py scheduler.py screener.py stats.py store.py \
             telegram_bot.py universe.py app/engine/
          mv alpha_vantage.py financial_datasets.py finnhub.py public_provider.py sec_edgar.py technicals.py app/defaults/providers/
          mv fundamentals.py liquidity.py trend.py grading.py app/defaults/rules/
          mv profiles.json watchlist.txt app/defaults/data/
          mv index.html app.js pages.js icons.js style.css logo.png app/ui/
          mv ema_zone.spec build.bat icon.ico build/
          rm -f selftest.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Goyim Screener.exe
        run: pyinstaller build/ema_zone.spec --noconfirm --clean

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/*" -DestinationPath "Windows-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-app
          path: Windows-app.zip
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Windows-app.zip
